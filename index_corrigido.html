<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlyController Telemetria</title><style>body{background:#10151d;color:#f3f6fc;font:16px system-ui;margin:0;padding:20px}main{max-width:680px;margin:auto}h1{color:#ffce36}button{background:#ffce36;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px}#status{margin:16px 0;color:#b8c5d5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:#202a37;border-radius:16px;padding:16px;min-width:0}.val{font-size:29px;font-weight:700;overflow-wrap:anywhere}.unit{color:#a7b7cb;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202a37;padding:12px;border-radius:12px;font-size:12px}small{color:#a7b7cb}.wide{grid-column:1/-1}.warn{color:#ffce36}</style></head><body><main><h1>FlyController</h1><p>Telemetria BLE • Somente leitura</p><button id="connect">Conectar por Bluetooth</button><div id="status">Desconectado</div><div class="grid" id="tiles"></div><h3>Última mensagem</h3><pre id="raw">Aguardando...</pre><small>Leitura do protocolo $XCTOD. Percentuais de carga são estimativas do FlyController, não necessariamente do BMS. Não envia comandos ao motor. No iPhone use Bluefy; página deve estar em HTTPS.</small></main><script>
const service='6e400001-b5a3-f393-e0a9-e50e24dcca9e',tx='6e400003-b5a3-f393-e0a9-e50e24dcca9e';let buffer='',last=0;
const fields=[['Carga calculada','% ',0],['Carga por tensão','%',1],['Tensão da bateria','V',2],['Corrente ESC','A',10],['Potência','kW',3],['RPM','rpm',9],['Acelerador','%',4],['Potência limite','%',6],['Temperatura motor','°C',7],['Temperatura ESC','°C',11],['Estado','',12],['Temperatura BMS','°C',13],['Célula mínima','mV',14],['Célula máxima','mV',15]];
const tiles=document.getElementById('tiles');tiles.innerHTML=fields.map(([n,u],i)=>`<div class="tile"><div class="unit">${n}</div><div class="val" id="v${i}">—</div><div class="unit">${u.trim()}</div></div>`).join('');
function show(line){const a=line.trim().split(',');if(a.length!==17||a[0]!=='$XCTOD')return false;const f=a.slice(1);document.getElementById('raw').textContent=line.trim();fields.forEach(([, ,idx],i)=>{let x=f[idx];document.getElementById('v'+i).textContent=x===''?'—':x});last=Date.now();document.getElementById('status').textContent='Recebendo telemetria';return true;}
function onData(e){const chunk=new TextDecoder().decode(e.target.value);buffer+=chunk;if(buffer.length>2048)buffer=buffer.slice(-1024);const lines=buffer.split(/\r?\n/);buffer=lines.pop();for(const l of lines){if(l.startsWith('$XCTOD'))show(l)}if(buffer.startsWith('$XCTOD')&&buffer.split(',').length===17){if(show(buffer))buffer='';}}
document.getElementById('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Este navegador não oferece Web Bluetooth. No iPhone, abra no Bluefy.');document.getElementById('status').textContent='Procurando FlyController...';const dev=await navigator.bluetooth.requestDevice({filters:[{services:[service]}],optionalServices:[service]});dev.addEventListener('gattserverdisconnected',()=>document.getElementById('status').textContent='Desconectado');const server=await dev.gatt.connect(),svc=await server.getPrimaryService(service),ch=await svc.getCharacteristic(tx);ch.addEventListener('characteristicvaluechanged',onData);await ch.startNotifications();document.getElementById('status').textContent='Conectado — aguardando dados';}catch(e){document.getElementById('status').textContent='Erro: '+e.message;}};
setInterval(()=>{if(last&&Date.now()-last>5000)document.getElementById('status').textContent='Sem telemetria recente';},2000);
</script></body></html>
