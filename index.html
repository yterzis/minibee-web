<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlyController Telemetria</title><style>body{background:#10151d;color:#f3f6fc;font:16px system-ui;margin:0;padding:20px}main{max-width:680px;margin:auto}h1{color:#ffce36}button{background:#ffce36;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px}#status{margin:16px 0;color:#b8c5d5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{background:#202a37;border-radius:16px;padding:18px}.val{font-size:30px;font-weight:700}.unit{color:#a7b7cb}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202a37;padding:12px;border-radius:12px;font-size:12px}small{color:#a7b7cb}</style><main><h1>FlyController</h1><p>Telemetria BLE • Somente leitura</p><button id="connect">Conectar por Bluetooth</button><div id="status">Desconectado</div><div class="grid" id="tiles"></div><h3>Última mensagem</h3><pre id="raw">Aguardando...</pre><small>Baseado no protocolo $XCTOD do fly-app original. Não envia comandos ao motor. Use Bluefy no iPhone ou Chrome/Edge compatível no computador. Hospede via HTTPS para conectar.</small></main><script>
const service='6e400001-b5a3-f393-e0a9-e50e24dcca9e',tx='6e400003-b5a3-f393-e0a9-e50e24dcca9e';let buffer='',last=0;
const names=[['Bateria','%'],['Tensão','V'],['Corrente','A'],['Potência','kW'],['RPM','rpm'],['Motor','°C'],['ESC','°C'],['Acelerador','%'],['Estado','']];
const tiles=document.getElementById('tiles');tiles.innerHTML=names.map(([n,u],i)=>`<div class="tile"><div class="unit">${n}</div><div class="val" id="v${i}">—</div><div class="unit">${u}</div></div>`).join('');
function show(line){document.getElementById('raw').textContent=line;const a=line.trim().split(',');if(a.length!==17||a[0]!=='$XCTOD')return;const f=a.slice(1);let v=[f[0],f[2],f[10],f[3],f[9],f[7],f[11],f[4],f[12]];v.forEach((x,i)=>document.getElementById('v'+i).textContent=x||'—');last=Date.now();document.getElementById('status').textContent='Recebendo telemetria';}
function onData(e){const chunk=new TextDecoder().decode(e.target.value);buffer+=chunk;let lines=buffer.split(/\r?\n/);buffer=lines.pop();for(const l of lines)if(l.startsWith('$XCTOD'))show(l);if(buffer.startsWith('$XCTOD')&&buffer.split(',').length===17){show(buffer);buffer='';}}
document.getElementById('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Este navegador não oferece Web Bluetooth. No iPhone, abra a página no Bluefy.');document.getElementById('status').textContent='Procurando FlyController...';const dev=await navigator.bluetooth.requestDevice({filters:[{services:[service]}],optionalServices:[service]});dev.addEventListener('gattserverdisconnected',()=>document.getElementById('status').textContent='Desconectado');const server=await dev.gatt.connect(),svc=await server.getPrimaryService(service),ch=await svc.getCharacteristic(tx);ch.addEventListener('characteristicvaluechanged',onData);await ch.startNotifications();document.getElementById('status').textContent='Conectado — aguardando dados';}catch(e){document.getElementById('status').textContent='Erro: '+e.message;}};
setInterval(()=>{if(last&&Date.now()-last>5000)document.getElementById('status').textContent='Conectado, sem telemetria recente';},2000);
</script></html>
